services:
  bifrost:
    image: maximhq/bifrost:v1.6.9
    container_name: bifrost
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    ports:
      - "9765:8080"
    volumes:
      - ~/.config/bifrost/config.json:/app/data/config.json
      - ~/.config/bifrost/dbs/:/app/data/dbs/
      - ~/.config/bifrost/logs/:/app/data/logs/
    env_file:
      - .env
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey-bundle:9.1.2
    container_name: bifrost-valkey
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 2GB
    command:
      - valkey-server
      - "--save"
      - "60"
      - "1"
      - "--loglevel"
      - warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey-data:
