services:
  bifrost:
    image: maximhq/bifrost:v1.6.8
    container_name: bifrost
    ports:
      - "9765:8080"
    volumes:
      - ~/.config/bifrost/config.json:/app/data/config.json
      - ~/.config/bifrost/config.db:/app/data/config.db
      - ~/.config/bifrost/config.db-shm:/app/data/config.db-shm
      - ~/.config/bifrost/config.db-wal:/app/data/config.db-wal
      - ~/.config/bifrost/logs.db:/app/data/logs.db
      - ~/.config/bifrost/logs.db-shm:/app/data/logs.db-shm
      - ~/.config/bifrost/logs.db-wal:/app/data/logs.db-wal
    env_file:
      - .env
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey-bundle:9.1.2
    container_name: bifrost-valkey
    command:
      - valkey-server
      - "--save"
      - "60"
      - "1"
      - "--loglevel"
      - warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey-data:
