session: γ
root: ""
windows:
  - name: work
    layout: even-horizontal
    root: ~/work/neo4j-cloud
    commands:
      - git switch master &&
        git fetch --prune &&
        git pull origin master
    panes:
      - root: ../upx
        layout: even-horizontal
        commands:
          - git switch trunk &&
            git fetch --prune &&
            git pull origin trunk &&
            pnpm install

  - name: nix
    root: ~/.config/nix-darwin
    layout: even-horizontal
    commands:
      - nix flake update --flake . &&
        sudo darwin-rebuild switch --flake . &&
        aerospace reload-config &&
        sketchybar --reload

  - name: configs
    root: ~/.config
    env:
      MISE_VEROBSE: 1
    layout: even-vertical
    commands:
      - zim &&
        ~/.tmux/plugins/tpm/scripts/update_plugin_prompt_handler.sh all
    panes:
      - root: ./mise
        commands:
          - mise plugins update &&
            mise upgrade --bump --interactive --exclude=lua &&
            mise cache prune

  - name: nvim
    root: ~/.config/nvim
    layout: even-horizontal
    commands:
      - nvim --headless "+Lazy! sync" +MasonUpdate +qa &&
        nvim +Mason
