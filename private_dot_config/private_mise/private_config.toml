[settings]
experimental = true
lockfile = true

[tools]
# Languages first
clang = "23.1.3"
go = "1.27.2"
lua = "5.1"
luajit = "2.1.1744318430"
node = "26.11.1"
python = "3.15.0"
ruby = "4.0.7"
rust = "1.99.0"

# Then tools
awscli = { version = "2.37.13", symlink_bins = "true" }
bun = "1.4.3"
clang-format = "23.1.3"
cloudflared = "2026.10.0"
cmake = "4.4.4"
coursier = { version = "2.1.26", exe = "cs" }
gcloud = { version = "588.0.0", postinstall = "gcloud components install $(cat ~/.default-cloud-sdk-components)" }
gh = "2.102.0"
jb = "0.6.0"
make = "4.4.1"
maven = "3.10.0"
ninja = "1.13.2"
opencode = "1.19.0"
rtk = { version = "0.51.0", postinstall = "rtk init -g --opencode" }
terraform = "1.16.5"
tree-sitter = "0.27.1"
uv = "0.13.0"

# And custom tools
[tools."http:cypher-shell"]
# Check latest version at: https://neo4j.com/deployment-center/?cypher-shell
version = "2026.09.0"
bin = "cypher-shell"
url = "https://dist.neo4j.org/cypher-shell/cypher-shell-{{ version }}.zip"
checksum = "sha256:e0201a56380d13889511ad71ee0239403ddf5c6ec84108698d51b1bc42a5fde4"

[tools."http:opencode2"]
# Check latest version at https://github.com/anomalyco/opencode/tags
version = "2.0.27"
bin = "opencode"
rename_exe = { "opencode" = "opencode2" }
url = "https://opencode.ai/files/bin/{{ version }}/opencode-darwin-arm64.zip"
checksum = "sha256:391b1061dc3f1f4394b7fd19513b2e6ff12f31739ee12f33880506ed6ee008bc"
