[settings]
experimental = true
lockfile = true

[tools]
# Languages first
clang = "23.1.3"
go = "1.27.3"
lua = "5.1"
luajit = "2.1.1744318430"
node = "26.12.1"
python = "3.15.0"
ruby = "4.0.7"
rust = "1.99.1"

# Then tools
bun = "1.4.3"
clang-format = "23.1.3"
cloudflared = "2026.10.2"
cmake = "4.4.4"
difftastic = "latest"
gcloud = { version = "590.0.0", postinstall = "gcloud components install $(cat ~/.default-cloud-sdk-components)" }
gh = "2.102.1"
kubectl = "1.35.9"
maven = "3.10.0"
terraform = "1.16.6"
tree-sitter = "0.27.1"
uv = "0.13.4"
postgres = "18.6"

# And custom tools
[tools."http:cypher-shell"]
# Check latest version at: https://neo4j.com/deployment-center/?cypher-shell
version = "2026.10.0"
bin = "cypher-shell"
url = "https://dist.neo4j.org/cypher-shell/cypher-shell-{{ version }}.zip"
checksum = "sha256:2d5859c25fafd174253b3601b8df369bc7b7d4f53b13d93d8056bbb29521219f"

[tools."http:opencode2"]
# Check latest version at: https://github.com/anomalyco/opencode/tags
version = "2.1.2"
bin = "opencode"
url = "https://opencode.ai/files/bin/{{ version }}/opencode-darwin-arm64.zip"
checksum = "sha256:1051221bbce68e541f432be07d58beb66c1827dae9e04417a49f56115e0e0d4c"
