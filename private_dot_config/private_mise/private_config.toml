[settings]
experimental = true
lockfile = true

[tools]
# Languages first
clang = "23.1.6"
go = "1.27.4"
lua = "5.1"
luajit = "2.1.1744318430"
node = "26.13.1"
python = "3.15.2"
ruby = "4.0.10"
rust = "1.100.0"

# Then tools
age = "1.3.2"
bun = "1.4.5"
clang-format = "23.1.6"
cloudflared = "2026.11.1"
cmake = "4.5.0"
difftastic = "latest"
gcloud = { version = "594.0.0", postinstall = "gcloud components install $(cat ~/.default-cloud-sdk-components)" }
gh = "2.105.0"
kubectl = "1.35.9"
maven = "3.10.1"
postgres = "18.7"
terraform = "1.17.2"
tree-sitter = "0.27.2"
uv = "0.13.9"

# And custom tools
[tools."http:cypher-shell"]
# Check latest version at: https://neo4j.com/deployment-center/?cypher-shell
version = "2026.10.2"
bin = "cypher-shell"
url = "https://dist.neo4j.org/cypher-shell/cypher-shell-{{ version }}.zip"
checksum = "sha256:b60df0d21b3b236e4a4f359277477f5595b3d8a6253eaa2226f724641ff2677c"
