[settings]
experimental = true
lockfile = true

[tools]
# Languages first
clang = "23.1.4"
go = "1.27.3"
lua = "5.1"
luajit = "2.1.1744318430"
node = "26.12.1"
python = "3.15.1"
ruby = "4.0.9"
rust = "1.99.1"

# Then tools
bun = "1.4.4"
clang-format = "23.1.4"
cloudflared = "2026.10.3"
cmake = "4.4.4"
difftastic = "latest"
gcloud = { version = "590.0.1", postinstall = "gcloud components install $(cat ~/.default-cloud-sdk-components)" }
gh = "2.103.2"
kubectl = "1.35.9"
maven = "3.10.0"
terraform = "1.17.0"
tree-sitter = "0.27.1"
uv = "0.13.5"
postgres = "18.6"

# And custom tools
[tools."http:cypher-shell"]
# Check latest version at: https://neo4j.com/deployment-center/?cypher-shell
version = "2026.10.1"
bin = "cypher-shell"
url = "https://dist.neo4j.org/cypher-shell/cypher-shell-{{ version }}.zip"
checksum = "sha256:cd3604b5bcaa45079d2ea64746ae9bbc880a262d09f92d4d8fa89576fd0484b8"

[tools."http:opencode2"]
# Check latest version at: https://github.com/anomalyco/opencode/tags
version = "2.1.4"
bin = "opencode"
url = "https://opencode.ai/files/bin/{{ version }}/opencode-darwin-arm64.zip"
checksum = "sha256:f9edc1dded080e39aa61db94270a51af66772ac572be7d6b15fa6f87251a3dff"
