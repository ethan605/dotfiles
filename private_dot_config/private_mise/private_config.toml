[settings]
experimental = true
lockfile = true

[tools]
# Languages first
clang = "23.1.1"
go = "1.27.1"
lua = "5.1"
luajit = "2.1.1744318430"
node = "26.10.0"
python = "3.14.7"
ruby = "4.0.7"
rust = "1.98.1"

# Then tools
awscli = { version = "2.37.0", symlink_bins = "true" }
azure = { version = "2.90.0", uvx_args = "--prerelease=allow" }
bun = "1.4.2"
clang-format = "23.1.1"
cmake = "4.4.3"
coursier = { version = "2.1.25", exe = "cs" }
gcloud = { version = "586.0.0", postinstall = "gcloud components install $(cat ~/.default-cloud-sdk-components)" }
gh = "2.101.0"
jb = "0.6.0"
make = "4.4.1"
maven = "3.9.16"
ninja = "1.13.2"
opencode = "1.18.32"
rtk = { version = "0.49.0", postinstall = "rtk init -g --opencode" }
terraform = "1.16.3"
tree-sitter = "0.27.0"
uv = "0.12.17"
java = "openjdk-26.0.2.1"

# And custom tools
[tools."http:cypher-shell"]
# Check latest version at: https://neo4j.com/deployment-center/?cypher-shell
version = "2026.07.1"
bin = "cypher-shell"
url = "https://dist.neo4j.org/cypher-shell/cypher-shell-{{ version }}.zip"
checksum = "sha256:beae24efc0bf4bff48498825ac497addce28d932d8c2cbe2e845c7f2fb761d41"
